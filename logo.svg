<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Soft Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#textGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Intersecting Script Accent Rings -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4"/>
  <path d="M 120 256 A 136 136 0 0 0 392 256" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.4"/>

  <!-- Grantha Central Glyph (𑌗𑍍𑌰) stylized / Grantha Character -->
  <text x="256" y="290" text-anchor="middle" fill="url(#textGrad)" font-family="'Noto Serif Grantha', 'Grantha', serif" font-size="210" font-weight="bold" filter="url(#glow)">
    𑌗𑍍𑌰
  </text>
</svg>
